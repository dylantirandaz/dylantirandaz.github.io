<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>What does AI think Earth looks like?</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060c;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #e8edf3;
    -webkit-user-select: none; user-select: none; }
  #scene { position: fixed; inset: 0; }
  #title { position: fixed; top: 18px; left: 0; right: 0; text-align: center;
    pointer-events: none; z-index: 5; }
  #title h1 { margin: 0; font-size: clamp(17px, 3.4vw, 26px); font-weight: 650;
    letter-spacing: .2px; text-shadow: 0 2px 14px rgba(0,0,0,.8); }
  #title p { margin: 4px 0 0; font-size: clamp(11px, 2vw, 14px); color: #9fb0c3; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 10px 12px 14px; background: linear-gradient(transparent, rgba(2,4,8,.85) 40%); }
  .m { border: 1px solid #2c3a4d; background: rgba(13,20,30,.82); color: #dfe7f0;
    border-radius: 999px; padding: 9px 15px; font-size: 14px; cursor: pointer;
    display: flex; gap: 8px; align-items: baseline; }
  .m b { font-weight: 700; }
  .m span { font-size: 11.5px; color: #8fa3bb; font-variant-numeric: tabular-nums; }
  .m.on { border-color: #58a6ff; background: rgba(20,38,60,.92); }
  #relief { display: flex; align-items: center; gap: 8px; color: #9fb0c3;
    font-size: 13px; padding: 0 6px; }
  #relief input { width: 90px; accent-color: #58a6ff; }
  #foot { position: fixed; bottom: 2px; right: 8px; z-index: 4; font-size: 10.5px;
    color: #5b6b7e; pointer-events: none; }
  #load { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center;
    justify-content: center; background: #04060c; font-size: 15px; color: #9fb0c3;
    transition: opacity .5s; }
  #probe { position: fixed; top: 64px; right: 14px; z-index: 7; width: 340px;
    max-width: calc(100vw - 28px); box-sizing: border-box; background: rgba(10,16,26,.92);
    border: 1px solid #2c3a4d; border-radius: 12px; padding: 10px 12px 8px; font-size: 12.5px;
    color: #dfe7f0; -webkit-user-select: text; user-select: text; }
  #probe[hidden] { display: none; }
  #probe .where { display: flex; justify-content: space-between; align-items: baseline;
    font-weight: 650; font-size: 13.5px; }
  #probe .where button { background: none; border: 0; color: #8fa3bb; font-size: 17px;
    cursor: pointer; padding: 0 2px; }
  #probe .sub { color: #8fa3bb; margin: 2px 0 8px; line-height: 1.4; }
  #probe .key { margin: 6px 0 0; }
  #probe table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  #probe th, #probe td { padding: 3px 4px; text-align: right; border-bottom: 1px solid #1c2633; }
  #probe th:first-child, #probe td:first-child { text-align: left; }
  #probe th { color: #8fa3bb; font-weight: 500; font-size: 11.5px; }
  #probe tr.real td { font-weight: 650; }
  #probe tr.cur td { background: rgba(88,166,255,.14); }
  #probe td.ok { color: #7ee2a8; }
  #probe td.bad { color: #ff8a8a; }
</style>
<script type="importmap">
{ "imports": { "three": "./three.module.js", "three/addons/": "./addons/" } }
</script>
</head>
<body>
<a href="/" style="position:fixed;top:12px;left:14px;z-index:6;font-size:12px;color:#5b6b7e;text-decoration:none;">&larr; home</a>
<a href="writeup.html" style="position:fixed;top:12px;right:14px;z-index:6;font-size:12px;color:#8fa3bb;text-decoration:none;border:1px solid #2c3a4d;border-radius:999px;padding:5px 12px;background:rgba(13,20,30,.7);">write-up</a>
<div id="scene"></div>
<div id="title"><h1>What does AI think Earth looks like?</h1>
<p>Drag to spin &middot; Scroll to zoom &middot; Click to inspect</p></div>
<div id="probe" hidden></div>
<div id="bar"></div>
<div id="foot">Each globe: one AI asked about 4,050 places, never shown a map.</div>
<div id="load">Loading brains&hellip;</div>
<script>
window.addEventListener('error', function (e) {
  var l = document.getElementById('load');
  if (l && l.isConnected) l.innerHTML = 'Something failed to load.<br><span style="font-size:12px">Try Chrome or Safari on http://localhost:8080 (not as a file).</span>';
}, true);
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const MODELS = [
  { id: 'real-earth', name: '🌍 Real', pct: '✓',
    color: 'tex/real-earth-hd.jpg', height: 'tex/real-earth-hd_h.png' },
  { id: 'anthropic-claude-opus-5-5', name: 'Opus',     pct: '99%' },
  { id: 'openai-gpt-6-astra',        name: 'Astra',    pct: '98%' },
  { id: 'anthropic-claude-fable-5-1',name: 'Fable',    pct: '97%' },
  { id: 'qwen2-5-7b-instruct',       name: 'Qwen',     pct: '73%' },
  { id: 'llama3-1-8b',               name: 'Llama',    pct: '67%' },
  { id: 'gemma2-9b',                 name: 'Gemma',    pct: '49%' },
];
const QUESTIONS = [['landwater', 'land'], ['t+3000', '&gt;3000m'], ['t+1000', '&gt;1000m'],
                   ['t-1000', '&lt;&minus;1000m'], ['t-4000', '&lt;&minus;4000m']];
const CELL = 4; // degrees per probed cell

const el = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  document.getElementById('load').textContent = 'WebGL unavailable — try Chrome or Safari.';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
el.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060c);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.005, 200);
camera.position.set(0, 0.7, 3.1);

scene.add(new THREE.AmbientLight(0x8899bb, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-4, 2, 3);
scene.add(sun);

// stars
{
  const n = 1600, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 30 + Math.random() * 40, t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(p) * Math.cos(t); pos[i*3+1] = r * Math.cos(p); pos[i*3+2] = r * Math.sin(p) * Math.sin(t);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x8899bb, size: 0.09, sizeAttenuation: true })));
}

const globe = new THREE.Mesh(
  new THREE.SphereGeometry(1, 512, 256),
  new THREE.MeshStandardMaterial({ roughness: 1.0, metalness: 0.0, displacementScale: 0.07 })
);
scene.add(globe);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.maxDistance = 9;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
// Closest zoom: about 14° of surface across the view, where the 0.1° real relief still reads.
function setMinDistance() { controls.minDistance = 1.13 + globe.material.displacementScale; }
setMinDistance();
// Near the surface, a drag or a wheel tick should move a similar share of the view as from far away.
function scaleSpeeds() {
  const d = camera.position.length();
  controls.rotateSpeed = THREE.MathUtils.clamp((d - 1) * 0.45, 0.02, 1);
  controls.zoomSpeed = THREE.MathUtils.clamp(2 * (d - 1) / d, 0.05, 1.5);
}
scaleSpeeds();
controls.addEventListener('change', scaleSpeeds);
let idleTimer = null;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(idleTimer); });
controls.addEventListener('end', () => {
  idleTimer = setTimeout(() => { controls.autoRotate = camera.position.length() > 2.2 && !picked; }, 4000);
});

const loader = new THREE.TextureLoader();
loader.setCrossOrigin('anonymous');
const cache = {};
function textures(m) {
  if (!cache[m.id]) {
    const color = m.color || 'tex/' + m.id + '.png', height = m.height || 'tex/' + m.id + '_h.png';
    cache[m.id] = Promise.all([loader.loadAsync(color), loader.loadAsync(height)]).then(([map, disp]) => {
      map.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return { map, disp };
    });
  }
  return cache[m.id];
}
let current = null;
function show(id) {
  current = id;
  const m = MODELS.find(x => x.id === id);
  const button = document.querySelector('.m[data-id="' + id + '"]');
  document.querySelectorAll('.m').forEach(b => b.classList.toggle('on', b === button));
  const tag = button.querySelector('span');
  tag.textContent = '…';
  textures(m).then(t => {
    tag.textContent = m.pct;
    if (current !== id) return; // a later pick won
    globe.material.map = t.map;
    globe.material.displacementMap = t.disp;
    globe.material.needsUpdate = true;
    renderPanel();
  }, () => { tag.textContent = 'failed'; });
}

// buttons
const bar = document.getElementById('bar');
for (const m of MODELS) {
  const b = document.createElement('button');
  b.className = 'm';
  b.dataset.id = m.id;
  b.innerHTML = '<b>' + m.name + '</b><span>' + m.pct + '</span>';
  b.onclick = () => show(m.id);
  bar.appendChild(b);
}
const rw = document.createElement('label');
rw.id = 'relief';
rw.innerHTML = '⛰️ <input id="ex" type="range" min="0" max="0.3" step="0.005" value="0.07">';
bar.appendChild(rw);
document.getElementById('ex').oninput = e => {
  globe.material.displacementScale = +e.target.value;
  setMinDistance();
  placeMarker();
};

// click to inspect: what every model answered for the 4° cell under the pointer
const panel = document.getElementById('probe');
let cells = null;
fetch('cells.json').then(r => r.json()).then(d => { cells = d; renderPanel(); });
let picked = null; // { lat, lon, j, i }

// SphereGeometry puts lon -180 (texture u = 0) on -x and the north pole on +y.
function toLatLon(p) {
  const lat = 90 - THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(p.y / p.length(), -1, 1)));
  let phi = Math.atan2(p.z, -p.x);
  if (phi < 0) phi += 2 * Math.PI;
  return { lat, lon: THREE.MathUtils.radToDeg(phi) - 180 };
}
function toVector(lat, lon, r) {
  const theta = THREE.MathUtils.degToRad(90 - lat), phi = THREE.MathUtils.degToRad(lon + 180);
  return new THREE.Vector3(-r * Math.cos(phi) * Math.sin(theta), r * Math.cos(theta),
                           r * Math.sin(phi) * Math.sin(theta));
}

const marker = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), new THREE.MeshBasicMaterial({ color: 0xff5a5a }));
const outline = new THREE.LineLoop(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xffd166 }));
marker.visible = outline.visible = false;
scene.add(marker, outline);

function placeMarker() {
  if (!picked) return;
  const top = 1 + globe.material.displacementScale + 0.002;
  marker.position.copy(toVector(picked.lat, picked.lon, top));
  const south = -90 + picked.j * CELL, west = -180 + picked.i * CELL, pts = [];
  for (let k = 0; k < 8; k++) pts.push(toVector(south, west + CELL * k / 8, top));
  for (let k = 0; k < 8; k++) pts.push(toVector(south + CELL * k / 8, west + CELL, top));
  for (let k = 0; k < 8; k++) pts.push(toVector(south + CELL, west + CELL * (1 - k / 8), top));
  for (let k = 0; k < 8; k++) pts.push(toVector(south + CELL * (1 - k / 8), west, top));
  outline.geometry.setFromPoints(pts);
  marker.visible = outline.visible = true;
}

const raycaster = new THREE.Raycaster();
function inspect(x, y) {
  raycaster.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  // Aim at the middle of the relief so tilted views land close to the visible surface.
  const sphere = new THREE.Sphere(new THREE.Vector3(), 1 + globe.material.displacementScale * 0.5);
  const hit = raycaster.ray.intersectSphere(sphere, new THREE.Vector3());
  if (!hit) { closePanel(); return; }
  const { lat, lon } = toLatLon(hit);
  picked = { lat, lon,
             j: Math.min(Math.floor((lat + 90) / CELL), 180 / CELL - 1),
             i: Math.min(Math.floor((lon + 180) / CELL), 360 / CELL - 1) };
  controls.autoRotate = false;
  placeMarker();
  renderPanel();
}
function closePanel() {
  picked = null;
  panel.hidden = true;
  marker.visible = outline.visible = false;
}

const deg = (v, pos, neg) => Math.abs(v).toFixed(1) + '°' + (v >= 0 ? pos : neg);
function renderPanel() {
  if (!picked) return;
  panel.hidden = false;
  const { lat, lon, j, i } = picked;
  const head = '<div class="where"><span>' + deg(lat, 'N', 'S') + ', ' + deg(lon, 'E', 'W') +
               '</span><button aria-label="Close">&times;</button></div>';
  if (!cells) {
    panel.innerHTML = head + '<div class="sub">Loading answers…</div>';
  } else {
    const idx = j * (360 / CELL) + i, elev = cells.real_elev[idx];
    const truth = { landwater: cells.real_land[idx], 't+3000': elev > 3000, 't+1000': elev > 1000,
                    't-1000': elev < -1000, 't-4000': elev < -4000 };
    let rows = '<tr class="real"><td>Real</td>' +
               QUESTIONS.map(([k]) => '<td>' + (truth[k] ? 'yes' : 'no') + '</td>').join('') + '</tr>';
    for (const m of MODELS.slice(1)) {
      const answers = cells.models[m.id];
      rows += '<tr class="' + (m.id === current ? 'cur' : '') + '"><td>' + m.name + '</td>' +
              QUESTIONS.map(([k]) => {
                const p = answers[k][idx];
                if (p === null) return '<td>—</td>';
                return '<td class="' + ((p > 50) === truth[k] ? 'ok' : 'bad') + '">' + p + '%</td>';
              }).join('') + '</tr>';
    }
    panel.innerHTML = head +
      '<div class="sub">4° cell centered on ' + deg(-90 + (j + 0.5) * CELL, 'N', 'S') + ', ' +
      deg(-180 + (i + 0.5) * CELL, 'E', 'W') + '. Real elevation there: ' + elev.toLocaleString('en-US') +
      ' m (ETOPO1).</div><table><tr><th>P(yes)</th>' +
      QUESTIONS.map(([, label]) => '<th>' + label + '</th>').join('') + '</tr>' + rows + '</table>' +
      '<div class="sub key">Green: matches the real answer. Red: wrong. —: no answer.</div>';
  }
  panel.querySelector('button').onclick = closePanel;
}

let press = null;
renderer.domElement.addEventListener('pointerdown', e => { press = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) < 6 && performance.now() - press.t < 400) {
    inspect(e.clientX, e.clientY);
  }
  press = null;
});
addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  marker.scale.setScalar(0.005 * Math.max(0.12, camera.position.length() - 1));
  renderer.render(scene, camera);
})();

// preload the model textures, then reveal (start on Astra: prettiest strong result).
// The HD real Earth (~4 MB) loads only when picked.
let revealed = false;
function reveal() {
  if (revealed) return;
  revealed = true;
  const l = document.getElementById('load');
  if (l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 600); }
  show('openai-gpt-6-astra');
}
Promise.allSettled(MODELS.filter(m => !m.color).map(textures)).then(reveal);
setTimeout(reveal, 20000); // never stick forever
</script>
</body>
</html>
